[package]
name = "perch"
version = "0.1.0"
edition = "2021"
description = "tmux-native home base for coding agents"
license = "MIT"
repository = "https://github.com/idossha/perch"
homepage = "https://github.com/idossha/perch"
readme = "README.md"
keywords = ["tmux", "tui", "agents", "claude", "hooks"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
